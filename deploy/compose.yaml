services:
  soloid:
    image: ${SOLOID_IMAGE:-ghcr.io/st3fan/soloid:latest}
    build:
      context: ..
      args:
        SOLOID_VERSION: ${SOLOID_VERSION:-}
        SOLOID_COMMIT: ${SOLOID_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      SOLOID_CONFIG: /config/config.json
    volumes:
      - ./config:/config:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/soloid", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "${SOLOID_BIND:-127.0.0.1}:${SOLOID_PORT:-3000}:3000"
