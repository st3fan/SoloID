services:
  soloid:
    image: ${SOLOID_IMAGE:-ghcr.io/st3fan/soloid:latest}
    build:
      context: ..
    restart: unless-stopped
    environment:
      SOLOID_CONFIG: /config/config.json
    volumes:
      - ./config:/config:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "${SOLOID_BIND:-127.0.0.1}:${SOLOID_PORT:-3000}:3000"
